[package]
name = "pixel-connect"
version = "0.1.0"
default-run = "pixel-connect"
edition = "2021"
authors = ["Pixel Connect contributors"]
repository = "https://github.com/pixelconnect/pixel-connect"
license = "AGPL-3.0"
description = "Pixel Connect — Quick Share, clipboard, mirroring and device integration for Linux"
rust-version = "1.80"

[build-dependencies]
tauri-build = { version = "2.0", features = [] }

[dependencies]
anyhow = "1.0"
fern = { version = "0.7", features = ["colored"] }
humantime = "2.1"
log = "0.4"
notify-rust = "4.10"
# Quick Share protocol (derived from rquickshare's rqs_lib, AGPL-3.0).
pixel_connect_quickshare = { path = "../../../core/quickshare", features = ["experimental"] }
# KDE Connect protocol v8 implementation.
pixel_connect_kdeconnect = { path = "../../../core/kdeconnect" }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sys_metrics = "0.2"
tauri = { version = "2.2", features = ["tray-icon", "image-png"] }
tauri-plugin-autostart = "2.2"

tauri-plugin-notification = "2.2"
tauri-plugin-single-instance = "2.2"
tauri-plugin-store = "2.2"
tauri-plugin-dialog = "2.2"
tauri-plugin-shell = "2.2"
tauri-plugin-clipboard-manager = "2.2"
time = { version = "0.3", features = ["formatting"] }
tokio = { version = "1", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "fs", "process"] }
tokio-util = { version = "0.7", features = ["rt"] }
arboard = "3.4"
wl-clipboard-rs = "0.9"
dirs = "6.0"

[features]
# by default Tauri runs in production mode
# when `tauri dev` runs it is executed with `cargo run --no-default-features` if `devPath` is an URL
default = ["custom-protocol"]
# this feature is used for production builds where `devPath` points to the filesystem
# DO NOT remove this
custom-protocol = ["tauri/custom-protocol"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1