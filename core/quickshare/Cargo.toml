# Pixel Connect — Google Quick Share protocol core
#
# This crate is a derivative work of `rqs_lib` from the rquickshare project:
#   https://github.com/Martichou/rquickshare  (Copyright (c) Martin ANDRE,
#   licensed under the GNU Affero General Public License v3.0)
#
# The Google Quick Share / Nearby Connections wire protocol implementation
# (mDNS service, BLE advertisement, UKEY2/PAKE handshake, secure message
# framing, payload transfer) is reused unchanged in behaviour. Only the crate
# name, the public service struct name and log/environment identifiers were
# changed. See ../../NOTICE.md and ../../docs/architecture/repo-audit.md.

[package]
name = "pixel_connect_quickshare"
version = "0.11.5"
edition = "2021"
authors = ["Martin ANDRE (original rquickshare)", "Pixel Connect contributors"]
license = "AGPL-3.0"
description = "Google Quick Share (Nearby Connections) protocol implementation used by Pixel Connect"
repository = "https://github.com/Martichou/rquickshare"
publish = false

[[bin]]
name = "pixel-connect-quickshare"
path = "src/bin.rs"

[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17", features = ["full"], optional = true }

[target.'cfg(all(target_arch = "aarch64", target_os = "linux"))'.dependencies]
dbus = { version = "0.9", features = ["vendored"] }

[dependencies]
anyhow = "1.0"
base64 = "0.22"
btleplug = { version = "0.11", optional = true }
bytes = "1.10"
directories = "6.0"
futures = "0.3"
get_if_addrs = "0.5"
hex = "0.4"
hkdf = "0.12"
hmac = "0.12"
libaes = "0.7"
log = "0.4"
mdns-sd = { git = "https://github.com/Martichou/mdns-sd", branch = "unsolicited" }
mime_guess = "2.0"
num-bigint = "0.4"
once_cell = "1.20"
p256 = { version = "0.13", features = ["ecdh"] }
prost = "0.13"
rand = "0.9"
serde = { version = "1.0", features = ["derive"] }
sha2 = "0.10"
sys_metrics = { git = "https://github.com/Martichou/sys_metrics" }
tokio = { version = "1.43", features = ["macros", "rt", "rt-multi-thread", "net", "sync", "time", "io-util", "signal"] }
tokio-util = { version = "0.7", features = ["rt"] }
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
ts-rs = { version = "10.0", features = ["serde-compat", "uuid-impl", "chrono-impl"] }
uuid = "1.15"

[build-dependencies]
prost-build = "0.13"

[features]
default = ["experimental"]
experimental = ["bluer", "btleplug"]

[profile.release]
lto = true
opt-level = 3
codegen-units = 1